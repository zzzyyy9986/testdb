# Reverse proxy для Docker (Apache в контейнере на порту 8090).
#
# Установка (Debian/Ubuntu):
#   sudo cp deploy/nginx/testdb.djzazavi.ru.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/testdb.djzazavi.ru.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (Let's Encrypt):
#   sudo certbot --nginx -d testdb.djzazavi.ru

server {
    listen 80;
    listen [::]:80;
    server_name testdb.djzazavi.ru;

    # certbot раскомментирует/добавит редирект на HTTPS после выпуска сертификата

    client_max_body_size 75M;

    access_log /var/log/nginx/testdb.djzazavi.ru.access.log;
    error_log  /var/log/nginx/testdb.djzazavi.ru.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
