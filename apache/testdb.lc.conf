# testdb.lc — конфиг для macOS Apache (/etc/apache2/other/)
LoadModule rewrite_module libexec/apache2/mod_rewrite.so
LoadModule php7_module /opt/homebrew/opt/php@7.4/lib/httpd/modules/libphp7.so

<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

<VirtualHost *:80>
    ServerName testdb.lc
    DocumentRoot "/Users/admin/Desktop/projects/testdb.lc"

    <Directory "/Users/admin/Desktop/projects/testdb.lc">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "/private/var/log/apache2/testdb.lc-error_log"
    CustomLog "/private/var/log/apache2/testdb.lc-access_log" common
</VirtualHost>
